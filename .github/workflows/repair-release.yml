name: Repair release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable fork release tag to rebuild and verify
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: repair-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select existing release source
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json tagName
          cp scripts/collect-release-assets.py "$RUNNER_TEMP/collect-release-assets.py"
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4

      - name: Rebuild exact tagged source
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --clean --skip=publish

      - name: Verify against published checksums
        run: |
          python3 "$RUNNER_TEMP/collect-release-assets.py"
          gh release download "$RELEASE_TAG" --pattern checksums.txt --dir "$RUNNER_TEMP/published-checksums"
          cmp dist/checksums.txt "$RUNNER_TEMP/published-checksums/checksums.txt"

      - name: Restore verified binary assets
        run: gh release upload "$RELEASE_TAG" release-assets/SignTools_* --clobber
