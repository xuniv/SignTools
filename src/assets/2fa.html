<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SignTools · Verification code</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/vendor/app.css" />
  </head>
  <body>
    <main class="standalone">
      <div class="standalone-card">
        <a class="brand" href="/" target="_top"><img src="/favicon.png" alt="" />SignTools</a>
        <h1>A quick verification</h1>
        <p>
          If Apple asks to verify your account, enter the six-digit code sent to your trusted device. It may take about
          a minute to arrive.
        </p>
        <form id="twofa-form" method="post" enctype="multipart/form-data">
          <label for="formToken">Verification code</label>
          <input
            id="formToken"
            name="token"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            autocomplete="one-time-code"
            placeholder="000000"
            required
            autofocus
            class="text-center font-mono text-2xl tracking-[.4em]"
          />
          <button class="primary-link" type="submit">Verify and continue</button>
          <p id="form-feedback" role="status" hidden></p>
        </form>
        <a class="back-link" href="/" target="_top">Back to your library</a>
      </div>
    </main>
    <script type="module" src="/js/twofa.js"></script>
  </body>
</html>
