version: 2
project_name: SignTools
before:
  hooks:
    - bun install --frozen-lockfile --ignore-scripts
    - bun run build
builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -buildid=
    flags:
      - -trimpath
      - -buildvcs=false
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    goarm:
      - 6
      - 7
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
checksum:
  name_template: checksums.txt
release:
  # The numeric suffix identifies a stable fork patch, not a prerelease.
  prerelease: false
  make_latest: true
changelog:
  disable: true
